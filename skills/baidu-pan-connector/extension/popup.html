<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; width: 340px; margin: 12px; font-size: 13px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 6px; }
    .tag { display: inline-block; font-size: 11px; color: #0b5; border: 1px solid #0b5; border-radius: 3px; padding: 0 5px; margin-bottom: 8px; }
    p { margin: 0 0 10px; line-height: 1.45; color: #444; }
    button { margin: 4px 4px 0 0; padding: 6px 10px; cursor: pointer; }
    textarea { width: 100%; height: 100px; font-family: Consolas, monospace; font-size: 11px; box-sizing: border-box; }
    .ok { color: #0a7; }
    .err { color: #b10e1e; }
    .muted { color: #777; font-size: 12px; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Baidu Pan Agent Connector</h1>
  <span class="tag">Unofficial · Capability only</span>
  <p>本扩展只提供<strong>执行能力</strong>：在已登录的 <code>pan.baidu.com</code> 上执行 Agent 下发的任务包。决策与编排由本地 Agent + Skills 完成。</p>
  <p class="muted">需本机任务桥 <code>127.0.0.1:27865</code>（默认）。非官方产品，与百度无关联。</p>
  <button id="poll" type="button">拉取任务桥</button>
  <button id="open" type="button">打开网盘</button>
  <button id="clear" type="button">清空全部任务</button>
  <p style="margin-top:12px">手动导入任务包 JSON（兜底）：</p>
  <textarea id="json" placeholder='{"schema":"baidu-pan-task-pack/v1", "id":"…", "tasks":[…]}'></textarea>
  <button id="import" type="button">导入</button>
  <p id="msg"></p>
  <script src="popup.js"></script>
</body>
</html>
