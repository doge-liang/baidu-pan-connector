name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate skill layout and metadata
        run: python scripts/validate_skill.py

      - name: Run Python tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate and package the Chrome extension
        run: bash scripts/test-extension.sh

  install-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build and verify a clean installed copy
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/baidu-pan-connector-install"
          python -B skills/baidu-pan-connector/scripts/sync_install.py \
            --install-dir "$target" --apply --check

      - name: Prove source drift is detected
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/baidu-pan-connector-install"
          printf '{}\n' > "$target/extension/manifest.json"
          if python -B skills/baidu-pan-connector/scripts/sync_install.py \
            --install-dir "$target" --check; then
            echo "sync check accepted a modified installation" >&2
            exit 1
          fi
